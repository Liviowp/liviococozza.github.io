backend:
  name: github
  repo: Liviowp/liviococozza.github.io
  branch: main
  auth_methods:
    - token

media_folder: uploads
public_folder: /uploads

locale: it

collections:
  - name: sito
    label: Gestione del sito
    files:
      - name: contenuti
        label: Contenuti del sito
        file: dati.json
        fields:
          - { label: Sottotitolo homepage, name: sottotitolo, widget: string }
          - { label: Titolo principale homepage, name: titolo_principale, widget: string }
          - { label: Descrizione homepage, name: descrizione_hero, widget: text }
          - { label: Fotografia di copertina, name: foto_sfondo, widget: image, required: false }
          - { label: Etichetta filosofia, name: filosofia_etichetta, widget: string }
          - { label: Titolo filosofia, name: filosofia_titolo, widget: string }
          - { label: Citazione filosofia, name: filosofia_citazione, widget: text }
          - { label: Testo filosofia, name: filosofia_testo, widget: text }
          - { label: Foto filosofia, name: foto_filosofia, widget: image, required: false }
          - { label: Etichetta galleria, name: galleria_etichetta, widget: string }
          - { label: Titolo galleria, name: galleria_titolo, widget: string }
          - { label: Descrizione galleria, name: galleria_descrizione, widget: text }
          - label: Fotografie della galleria
            name: galleria
            widget: list
            fields:
              - { label: Etichetta, name: etichetta, widget: string }
              - { label: Titolo, name: titolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
              - { label: Fotografia, name: foto, widget: image }
              - { label: Testo alternativo, name: alt, widget: string, required: false }
          - label: Esperienze e progetti
            name: esperienze
            widget: list
            fields:
              - { label: Titolo, name: titolo, widget: string }
              - { label: Sottotitolo, name: sottotitolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
              - { label: Fotografia, name: foto, widget: image }
              - { label: Testo alternativo, name: alt, widget: string, required: false }
          - { label: Etichetta blog, name: blog_etichetta, widget: string }
          - { label: Titolo blog, name: blog_titolo, widget: string }
          - { label: Descrizione blog, name: blog_descrizione, widget: text }
          - label: Articoli del blog
            name: articoli
            widget: list
            fields:
              - { label: Titolo articolo, name: titolo, widget: string }
              - { label: Data, name: data, widget: datetime, required: false }
              - { label: Riassunto, name: riassunto, widget: text }
              - { label: Testo articolo, name: contenuto, widget: markdown }
              - { label: Immagine, name: immagine, widget: image, required: false }
              - { label: Link esterno (facoltativo), name: link, widget: string, required: false }
          - { label: Etichetta servizi, name: servizi_etichetta, widget: string }
          - { label: Titolo servizi, name: servizi_titolo, widget: string }
          - label: Servizi professionali
            name: servizi
            widget: list
            fields:
              - { label: Titolo servizio, name: titolo, widget: string }
              - { label: Descrizione, name: descrizione, widget: text }
          - { label: Etichetta contatti, name: contatti_etichetta, widget: string }
          - { label: Titolo contatti, name: contatti_titolo, widget: string }
          - { label: Descrizione contatti, name: contatti_descrizione, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }
          - { label: Facebook URL, name: facebook, widget: string, required: false }
          - { label: Testo footer, name: footer_testo, widget: string }
