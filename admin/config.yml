backend:
  name: github
  repo: Liviowp/liviococozza.github.io
  branch: main

media_folder: "."
public_folder: "/"

collections:
  - name: "pagine"
    label: "Contenuti del Sito"
    files:
      - label: "Sezione Principale (Hero)"
        name: "hero"
        file: "dati.json"
        fields:
          - { label: "Sottotitolo Ruoli", name: "sottotitolo", widget: "string" }
          - { label: "Titolo Grande", name: "titolo_principale", widget: "string" }
          - { label: "Testo Descrittivo", name: "descrizione_hero", widget: "text" }
          - { label: "Foto Principale", name: "foto_sfondo", widget: "image" }
