
backend:
  name: github
  repo: Liviowp/liviococozza.github.io
  branch: main
  auth_methods:
    - token

media_folder: uploads
public_folder: /uploads

collections:
  - name: contenuti_home
    label: Contenuti del sito
    files:
      - name: testi_home
        label: Testi della homepage
        file: dati.json
        fields:
          - label: Sottotitolo (in inglese)
            name: sottotitolo
            widget: string
          - label: Titolo principale (in inglese)
            name: titolo_principale
            widget: string
          - label: Descrizione iniziale (in inglese)
            name: descrizione_hero
            widget: text
