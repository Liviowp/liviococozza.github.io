<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b5f93"/><stop offset=".5" stop-color="#24a8ca"/><stop offset="1" stop-color="#72d9e4"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#36b7d4"/><stop offset=".35" stop-color="#0877a7"/><stop offset="1" stop-color="#032d56"/></linearGradient>
 <linearGradient id="goal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7ffff"/><stop offset="1" stop-color="#c9f1f8"/></linearGradient>
 <radialGradient id="sunGlow"><stop stop-color="#e5ffff" stop-opacity=".65"/><stop offset="1" stop-color="#e5ffff" stop-opacity="0"/></radialGradient>
